[package]
name = "odin-rs"
version = "0.1.0"
edition = "2021"
# `ref/` holds reference copies of upstream client sources (Heimdall, odin4,
# brokkr-flash) used to transcribe the protocol; they must not be built.
autobins = false

[[bin]]
name = "odin-probe"
path = "src/main.rs"

[dependencies]
rusb = "0.9.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Devices_Communication",
    "Win32_System_IO",
] }
